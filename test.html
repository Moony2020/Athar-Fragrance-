<!DOCTYPE html>
<html>
<head>
<style>
.overlay {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  height: 300px;
  width: 150px;
  background: #333;
  color: white;
  padding: 20px;
  font-family: sans-serif;
}
.cardTitle, .cardDescription {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}
</style>
</head>
<body>
<div class="overlay">
  <span class="cardTitle">Woody</span>
  <span class="cardDescription">Warm • Grounded</span>
</div>
</body>
</html>
